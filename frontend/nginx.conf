server {
  listen 80;
  client_max_body_size 12m;
  root /usr/share/nginx/html;
  index index.html;

  # Django API, admin, uploaded media and Django static files
  location ~ ^/(api|admin|media|static)/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  # compress text responses
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  # React single-page app: hashed assets never change, index.html must always be re-checked
  location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location = /index.html { add_header Cache-Control "no-cache"; }
  location / { try_files $uri /index.html; add_header Cache-Control "no-cache"; }
}
